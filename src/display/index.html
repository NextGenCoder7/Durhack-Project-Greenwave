<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greenwave</title>
<style>
  /* Deliberately bare: visual design is a separate step. */
  body { font: 14px system-ui, sans-serif; margin: 12px; background: #fff; color: #111; }
  #controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  #panels { display: flex; flex-wrap: wrap; gap: 16px; }
  .panel { display: flex; flex-direction: column; gap: 4px; }
  .panel h2 { font-size: 15px; margin: 0; }
  .stats { font: 12px ui-monospace, monospace; white-space: pre; min-height: 6.5em; }
  canvas { border: 1px solid #ccc; cursor: crosshair; }
</style>
</head>
<body>
<div id="controls">
  <button id="amb">Spawn ambulance</button>
  <button id="fail">Fail central</button>
  <button id="cutall">Cut all links</button>
  <button id="restore">Restore all links</button>
  <button id="reset">Reset</button>
  <label>Speed <select id="speed"><option>1</option><option selected>3</option><option>5</option></select>×</label>
  <label><input type="checkbox" id="msgs"> Show messages</label>
  <span id="clock"></span>
</div>
<div id="panels"></div>
<p>Click a link (road between two junctions) to cut or restore it in all three panels.</p>
<script type="module" src="./main.js"></script>
</body>
</html>
